[package]
name = "hud-core"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"
repository = "https://github.com/XeraFang-Solutions/TF2-HUD-Studio"

[dependencies]
hud-syntax = { path = "../hud-syntax" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
regex = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
base64 = "0.22"
dunce = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
