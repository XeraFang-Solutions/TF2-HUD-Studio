version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /apps/desktop
    schedule: { interval: weekly }
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
